name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-python:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Sync version (tag, else pyproject)
        run: |
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *)  version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml) ;;
          esac
          sed -i "1s/.*/virtdeck (${version}-1) unstable; urgency=medium/" debian/changelog
      - name: Install build deps
        run: |
          apt-get update -qq
          apt-get install -y -qq devscripts debhelper dh-python \
            python3-all python3-setuptools python3-requests \
            python3-pyqtgraph python3-cryptography python3-pip \
            pybuild-plugin-pyproject
          pip3 install PySide6 --break-system-packages
      - name: Build .deb
        run: dpkg-buildpackage -b --no-sign
      - name: Copy .deb
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: artifacts/*.deb

  build-rpm:
    name: Build .rpm package (fedora/${{ matrix.fc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fc: 43
          - fc: 44
    container:
      image: fedora:${{ matrix.fc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf install -y -q rpm-build python3-devel python3-setuptools \
            python3-pip python3-wheel python3-requests \
            python3-pyqtgraph python3-cryptography
          pip3 install PySide6 --break-system-packages
      - name: Build .rpm
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *)  version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml) ;;
          esac
          sed -i "s/Version:.*/Version: ${version}/" virtdeck.spec
          # create source tarball from checkout
          tar czf /tmp/rpmbuild/SOURCES/virtdeck-${version}.tar.gz \
            --transform="s,^,virtdeck-${version}/," \
            --exclude=.git \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            --exclude='nodes.*' \
            .
          cp virtdeck.spec /tmp/rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/virtdeck.spec
      - name: Copy .rpm
        run: |
          mkdir -p artifacts
          cp /tmp/rpmbuild/RPMS/noarch/*.rpm artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package-fc${{ matrix.fc }}
          path: artifacts/*.rpm

  build-windows:
    name: Build Windows .zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller packaging/virtdeck-win.spec --noconfirm
      - name: Zip dist folder
        shell: pwsh
        run: Compress-Archive -Path dist/virtdeck/* -DestinationPath virtdeck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: virtdeck-windows.zip

  build-windows-installer:
    name: Build Windows .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller packaging/virtdeck-win.spec --noconfirm
      - name: Install NSIS via Chocolatey
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
      - name: Build installer with NSIS
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d') {
            # not a tag run — take the version from pyproject.toml
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          $distDir = Resolve-Path "dist/virtdeck"
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") {
            & "$nsisPath\makensis.exe" /DVERSION=$version /DDISTDIR="$distDir" packaging/virtdeck-installer.nsi
          } else {
            $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH
            makensis /DVERSION=$version /DDISTDIR="$distDir" packaging/virtdeck-installer.nsi
          }
      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Move-Item packaging/virtdeck-setup.exe "virtdeck-${version}-setup.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: virtdeck-*-setup.exe

  publish-repo:
    name: Publish packages to repo.mclure.ru
    needs: [build-python, build-deb, build-rpm, build-windows, build-windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: upload/
      - name: Lay out upload tree (apt suites, rpm per fedora release)
        run: |
          set -e
          mkdir -p upload/out/apt upload/out/rpm
          # one .deb per suite directory (same binary package everywhere)
          for s in bookworm noble trixie resolute; do
            mkdir -p upload/out/apt/$s
            cp upload/virtdeck_*.deb upload/out/apt/$s/
          done
          # rpm goes to the directory of its %{dist} tag (fc43 / fc44);
          # find is used because artifact nesting may vary
          while IFS= read -r rpm; do
            case "$(basename "$rpm")" in
              *fc43*) rel=43 ;;
              *fc44*) rel=44 ;;
              *) echo "unknown rpm dist tag: $rpm"; exit 1 ;;
            esac
            mkdir -p upload/out/rpm/fedora/$rel
            cp "$rpm" upload/out/rpm/fedora/$rel/
          done < <(find upload -name 'virtdeck-*.rpm' -type f)
      - name: rsync apt/rpm into repo incoming/
        env:
          KEY: ${{ secrets.REPO_DEPLOY_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          RSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          rsync -rv -e "$RSH" upload/out/apt/ repo-upload@repo.mclure.ru:apt/
          rsync -rv -e "$RSH" upload/out/rpm/ repo-upload@repo.mclure.ru:rpm/
          echo "the server regenerates and signs the indexes automatically"
      - name: Wait until the server publishes this exact build
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          deb_sha=$(sha256sum upload/virtdeck_*.deb | cut -d' ' -f1)
          echo "local artifacts: deb ${deb_sha:0:12}… (the server signs rpms, so rpm is matched by consistency)"
          ok_rpm_43=0; ok_rpm_44=0; ok_deb=0
          for i in $(seq 1 20); do
            sleep 15
            for rel in 43 44; do
              eval "ok=\$ok_rpm_$rel"
              [ "$ok" = "1" ] && continue
              if curl -fsSL "https://repo.mclure.ru/rpm/fedora/$rel/repodata/repomd.xml" -o /tmp/repomd.xml; then
                href=$(grep -oP '(?<=href=")[^"]*-primary\.xml\.zst' /tmp/repomd.xml | head -1 || true)
                live=""
                if [ -n "$href" ]; then
                  live=$(curl -fsSL "https://repo.mclure.ru/rpm/fedora/$rel/$href" | zstd -dc 2>/dev/null | awk -v want="$version" '
                  /<package type="rpm">/ {inblk=1; buf=""}
                  inblk {buf = buf "\n" $0}
                  /<\/package>/ {inblk=0; if (buf ~ /<name>virtdeck</ && match(buf, "<version [^>]*ver=\"" want "\"") && match(buf, /<checksum type="sha256"[^>]*>[a-f0-9]+/)) { s=substr(buf, RSTART, RLENGTH); sub(/.*>/, "", s); print s }}' || true)
                fi
                # the server signs rpms after upload, so compare against the
                # served file itself, not the CI artifact; every network call
                # here must tolerate a not-yet-published repo (implicit -e)
                if curl -fsSL "https://repo.mclure.ru/rpm/fedora/$rel/virtdeck-${version}-1.fc${rel}.noarch.rpm" -o /tmp/virtdeck.rpm 2>/dev/null; then
                  served=$(sha256sum /tmp/virtdeck.rpm | cut -d' ' -f1)
                  if [ -n "$live" ] && [ "$live" = "$served" ]; then
                    eval "ok_rpm_$rel=1"; echo "rpm fc$rel: repo metadata matches the served package ✓"
                  fi
                fi
              fi
            done
            if [ "$ok_deb" = "0" ]; then
              # the pool is append-only: several virtdeck versions stay
              # indexed, so select the stanza of THIS build, not the first
              live_deb=$(curl -fsSL https://repo.mclure.ru/apt/dists/bookworm/main/binary-amd64/Packages.gz \
                | zcat | awk -v ver="${version}-1" '
                  /^Package: / {pkg=$2}
                  /^Version: / {hit=(pkg=="virtdeck" && $2==ver)}
                  /^SHA256: /  {if (hit) {print $2; exit}}')
              if [ "$live_deb" = "$deb_sha" ]; then ok_deb=1; echo "deb: repo serves this build ✓"; fi
            fi
            if [ "$ok_rpm_43" = 1 ] && [ "$ok_rpm_44" = 1 ] && [ "$ok_deb" = 1 ]; then exit 0; fi
          done
          echo "the server did not publish this build in 5 minutes"
          exit 1

  smoke-packages:
    name: "Smoke: install .deb / .rpm (${{ matrix.image }})"
    needs: [publish-repo]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: deb
            image: ubuntu:24.04
            suite: noble
          - pkg: deb
            image: ubuntu:26.04
            suite: resolute
          - pkg: rpm
            image: fedora:43
            suite: "43"
          - pkg: rpm
            image: fedora:44
            suite: "44"
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install from repo.mclure.ru (apt / ${{ matrix.suite }})
        if: matrix.pkg == 'deb'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl gnupg
          install -dm755 /etc/apt/keyrings
          curl -fsSL https://repo.mclure.ru/KEY.gpg | gpg --dearmor -o /etc/apt/keyrings/virtdeck.gpg
          # verify the key fingerprint BEFORE trusting the repository
          gpg --show-keys /etc/apt/keyrings/virtdeck.gpg | grep -F "117DEABD3EA48810B219BA6B401F700FB97DE8B8"
          echo "deb [signed-by=/etc/apt/keyrings/virtdeck.gpg] https://repo.mclure.ru/apt ${{ matrix.suite }} main" \
            > /etc/apt/sources.list.d/virtdeck.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq virtdeck
          python3 -c "import PySide6.QtWebEngineWidgets; import virtdeck; print('deb smoke OK', virtdeck.__version__)"
      - name: Install from repo.mclure.ru (dnf / fedora ${{ matrix.suite }})
        if: matrix.pkg == 'rpm'
        run: |
          cat > /etc/yum.repos.d/virtdeck.repo <<EOF
          [virtdeck]
          name=VirtDeck
          baseurl=https://repo.mclure.ru/rpm/fedora/${{ matrix.suite }}
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://repo.mclure.ru/KEY.gpg
          EOF
          dnf install -y virtdeck
          python3 -c "from virtdeck import main; import virtdeck; print('rpm smoke OK', virtdeck.__version__)"

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-python, build-deb, build-rpm, build-windows, build-windows-installer, smoke-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts/
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VirtDeck ${{ github.ref_name }}
          body: |
            ## VirtDeck ${{ github.ref_name }}

            ### What changed

            > EDIT BEFORE PUBLISHING (release procedure, step "Release body"):
            > copy the version section from CHANGELOG.md here — a user with the
            > bug must see "Fixed: …", not a wall of install commands.

            ### Install

            Website: **https://virtdeck.mclure.ru** · Repository: **https://repo.mclure.ru**

            Download: `.deb` (Debian/Ubuntu), `.rpm` (Fedora), `.zip`/`.exe` (Windows); `.tar.gz` / `.whl` — from source.

            Debian 12 / 13, Ubuntu 24.04 / 26.04 — from the package repository (PySide6 comes from there too, no pip needed):
            ```
            curl -fsSL https://repo.mclure.ru/KEY.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/virtdeck.gpg
            echo "deb [signed-by=/etc/apt/keyrings/virtdeck.gpg] https://repo.mclure.ru/apt bookworm main" | sudo tee /etc/apt/sources.list.d/virtdeck.list
            sudo apt update && sudo apt install virtdeck
            ```
            (Ubuntu 24.04 — replace `bookworm` with `noble`; Ubuntu 26.04 — `resolute`; Debian 13 — `trixie`)

            Fedora 43 / 44:
            ```
            sudo tee /etc/yum.repos.d/virtdeck.repo <<'EOF'
            [virtdeck]
            name=VirtDeck
            baseurl=https://repo.mclure.ru/rpm/fedora/$releasever
            enabled=1
            gpgcheck=1
            repo_gpgcheck=1
            gpgkey=https://repo.mclure.ru/KEY.gpg
            EOF
            sudo dnf install virtdeck
            ```

            **Verify the repository key fingerprint after downloading it**
            (the key and the packages share one domain; the fingerprint is also
            published on the website and at repo.mclure.ru):
            ```
            117D EABD 3EA4 8810 B219 BA6B 401F 700F B97D E8B8
            ```

            For the VM console install virt-viewer (`sudo apt install virt-viewer` / `sudo dnf install virt-viewer`).
          files: artifacts/*
