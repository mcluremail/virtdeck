name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-python:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "1s/.*/virtdeck (${version}-1) unstable; urgency=medium/" debian/changelog
      - name: Install build deps
        run: |
          apt-get update -qq
          apt-get install -y -qq devscripts debhelper dh-python \
            python3-all python3-setuptools python3-requests \
            python3-pyqtgraph python3-cryptography python3-pip \
            pybuild-plugin-pyproject
          pip3 install PySide6 --break-system-packages
      - name: Build .deb
        run: dpkg-buildpackage -b --no-sign
      - name: Copy .deb
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: artifacts/*.deb

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf install -y -q rpm-build python3-devel python3-setuptools \
            python3-pip python3-wheel python3-requests \
            python3-pyqtgraph python3-cryptography
          pip3 install PySide6 --break-system-packages
      - name: Build .rpm
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/Version:.*/Version: ${version}/" virtdeck.spec
          # create source tarball from checkout
          tar czf /tmp/rpmbuild/SOURCES/virtdeck-${version}.tar.gz \
            --transform="s,^,virtdeck-${version}/," \
            --exclude=.git \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            --exclude='nodes.*' \
            .
          cp virtdeck.spec /tmp/rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/virtdeck.spec
      - name: Copy .rpm
        run: |
          mkdir -p artifacts
          cp /tmp/rpmbuild/RPMS/noarch/*.rpm artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: artifacts/*.rpm

  build-windows:
    name: Build Windows .zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller packaging/virtdeck-win.spec --noconfirm
      - name: Zip dist folder
        shell: pwsh
        run: Compress-Archive -Path dist/virtdeck/* -DestinationPath virtdeck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: virtdeck-windows.zip

  build-windows-installer:
    name: Build Windows .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller packaging/virtdeck-win.spec --noconfirm
      - name: Install NSIS via Chocolatey
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
      - name: Build installer with NSIS
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $distDir = Resolve-Path "dist/virtdeck"
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") {
            & "$nsisPath\makensis.exe" /DVERSION=$version /DDISTDIR="$distDir" packaging/virtdeck-installer.nsi
          } else {
            $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH
            makensis /DVERSION=$version /DDISTDIR="$distDir" packaging/virtdeck-installer.nsi
          }
      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Move-Item packaging/virtdeck-setup.exe "virtdeck-${version}-setup.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: virtdeck-*-setup.exe

  smoke-packages:
    name: "Smoke: install .deb / .rpm"
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: deb
            artifact: deb-package
            image: ubuntu:24.04
          - pkg: rpm
            artifact: rpm-package
            image: fedora:41
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Download ${{ matrix.pkg }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg/
      - name: Install .deb and import-check (Ubuntu 24.04)
        if: matrix.pkg == 'deb'
        run: |
          apt-get update -qq
          # PySide6 is not in the Debian/Ubuntu archives (pip-only) — the
          # deb ships the apt-installable deps, PySide6 comes from pip
          # exactly as documented in the release notes
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            python3-pip libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            ./pkg/virtdeck_*.deb
          pip3 install --break-system-packages PySide6
          python3 -c "from virtdeck import main; import virtdeck; print('deb smoke OK', virtdeck.__version__)"
      - name: Install .rpm and import-check (Fedora 41)
        if: matrix.pkg == 'rpm'
        run: |
          dnf install -y ./pkg/virtdeck-*.rpm
          python3 -c "from virtdeck import main; import virtdeck; print('rpm smoke OK', virtdeck.__version__)"

  create-release:
    name: Create GitHub Release
    needs: [build-python, build-deb, build-rpm, build-windows, build-windows-installer, smoke-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts/
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VirtDeck ${{ github.ref_name }}
          body: |
            ## VirtDeck ${{ github.ref_name }}

            Скачать: `.deb` для Debian/Ubuntu, `.rpm` для Fedora/RHEL, `.zip` для Windows; `.tar.gz` / `.whl` — установка из исходников.

            Установка .deb:
            ```
            sudo apt install ./virtdeck_*.deb
            pip3 install --break-system-packages PySide6
            sudo apt install virt-viewer
            ```

            Установка .rpm:
            ```
            sudo dnf install virtdeck-*.rpm
            pip install proxmoxer
            sudo dnf install virt-viewer
            ```

            Установка Windows:
            ```
            Распакуйте .zip в любую папку, запустите virtdeck.exe.
            Для консоли VM установите virt-viewer:
            https://virt-manager.org/download/
            ```
          files: artifacts/*
