name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-python:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Sync version (tag, else pyproject)
        run: |
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *)  version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml) ;;
          esac
          sed -i "1s/.*/virtdeck (${version}-1) unstable; urgency=medium/" debian/changelog
      - name: Install build deps
        run: |
          apt-get update -qq
          apt-get install -y -qq devscripts debhelper dh-python \
            python3-all python3-setuptools python3-requests \
            python3-pyqtgraph python3-cryptography python3-pip \
            pybuild-plugin-pyproject
          pip3 install PySide6 --break-system-packages
      - name: Build .deb
        run: dpkg-buildpackage -b --no-sign
      - name: Copy .deb
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: artifacts/*.deb

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf install -y -q rpm-build python3-devel python3-setuptools \
            python3-pip python3-wheel python3-requests \
            python3-pyqtgraph python3-cryptography
          pip3 install PySide6 --break-system-packages
      - name: Build .rpm
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *)  version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml) ;;
          esac
          sed -i "s/Version:.*/Version: ${version}/" virtdeck.spec
          # create source tarball from checkout
          tar czf /tmp/rpmbuild/SOURCES/virtdeck-${version}.tar.gz \
            --transform="s,^,virtdeck-${version}/," \
            --exclude=.git \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            --exclude='nodes.*' \
            .
          cp virtdeck.spec /tmp/rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/virtdeck.spec
      - name: Copy .rpm
        run: |
          mkdir -p artifacts
          cp /tmp/rpmbuild/RPMS/noarch/*.rpm artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: artifacts/*.rpm

  build-windows:
    name: Build Windows .zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller packaging/virtdeck-win.spec --noconfirm
      - name: Zip dist folder
        shell: pwsh
        run: Compress-Archive -Path dist/virtdeck/* -DestinationPath virtdeck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: virtdeck-windows.zip

  build-windows-installer:
    name: Build Windows .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller packaging/virtdeck-win.spec --noconfirm
      - name: Install NSIS via Chocolatey
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
      - name: Build installer with NSIS
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $distDir = Resolve-Path "dist/virtdeck"
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") {
            & "$nsisPath\makensis.exe" /DVERSION=$version /DDISTDIR="$distDir" packaging/virtdeck-installer.nsi
          } else {
            $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH
            makensis /DVERSION=$version /DDISTDIR="$distDir" packaging/virtdeck-installer.nsi
          }
      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Move-Item packaging/virtdeck-setup.exe "virtdeck-${version}-setup.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: virtdeck-*-setup.exe

  publish-repo:
    name: Publish packages to repo.mclure.ru
    needs: [build-python, build-deb, build-rpm, build-windows, build-windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: upload/
      - name: rsync apt/rpm into repo incoming/
        env:
          KEY: ${{ secrets.REPO_DEPLOY_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          RSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          for s in bookworm noble trixie; do
            rsync -v -e "$RSH" upload/virtdeck_*.deb repo-upload@repo.mclure.ru:apt/$s/
          done
          rsync -v -e "$RSH" upload/virtdeck-*.rpm repo-upload@repo.mclure.ru:rpm/
          echo "the server regenerates and signs the indexes automatically"

  smoke-packages:
    name: "Smoke: install .deb / .rpm"
    needs: [publish-repo]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: deb
            image: ubuntu:24.04
          - pkg: rpm
            image: fedora:41
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install from repo.mclure.ru (Ubuntu 24.04)
        if: matrix.pkg == 'deb'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl
          install -dm755 /etc/apt/keyrings
          curl -fsSL https://repo.mclure.ru/KEY.gpg -o /etc/apt/keyrings/virtdeck.gpg
          echo "deb [signed-by=/etc/apt/keyrings/virtdeck.gpg] https://repo.mclure.ru/apt noble main" \
            > /etc/apt/sources.list.d/virtdeck.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq virtdeck
          python3 -c "from virtdeck import main; import virtdeck; print('deb smoke OK', virtdeck.__version__)"
      - name: Install from repo.mclure.ru (Fedora 41)
        if: matrix.pkg == 'rpm'
        run: |
          cat > /etc/yum.repos.d/virtdeck.repo <<EOF
          [virtdeck]
          name=VirtDeck
          baseurl=https://repo.mclure.ru/rpm/fedora/41
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://repo.mclure.ru/KEY.gpg
          EOF
          dnf install -y virtdeck
          python3 -c "from virtdeck import main; import virtdeck; print('rpm smoke OK', virtdeck.__version__)"

  create-release:
    name: Create GitHub Release
    needs: [build-python, build-deb, build-rpm, build-windows, build-windows-installer, smoke-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts/
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VirtDeck ${{ github.ref_name }}
          body: |
            ## VirtDeck ${{ github.ref_name }}

            Скачать: `.deb` для Debian/Ubuntu, `.rpm` для Fedora/RHEL, `.zip` для Windows; `.tar.gz` / `.whl` — установка из исходников.

            Debian 12 / 13 и Ubuntu 24.04 — из пакета-репозитория (PySide6 приедет оттуда же, pip не нужен):
            ```
            curl -fsSL https://repo.mclure.ru/KEY.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/virtdeck.gpg
            echo "deb [signed-by=/etc/apt/keyrings/virtdeck.gpg] https://repo.mclure.ru/apt bookworm main" | sudo tee /etc/apt/sources.list.d/virtdeck.list
            sudo apt update && sudo apt install virtdeck
            ```
            (Ubuntu 24.04 — замените `bookworm` на `noble`, Debian 13 — на `trixie`)

            Fedora 41:
            ```
            sudo tee /etc/yum.repos.d/virtdeck.repo <<'EOF'
            [virtdeck]
            name=VirtDeck
            baseurl=https://repo.mclure.ru/rpm/fedora/41
            enabled=1
            gpgcheck=1
            repo_gpgcheck=1
            gpgkey=https://repo.mclure.ru/KEY.gpg
            EOF
            sudo dnf install virtdeck
            ```

            Для консоли VM установите virt-viewer (`sudo apt install virt-viewer` / `sudo dnf install virt-viewer`).
          files: artifacts/*
