name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check virtdeck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1
          pip install -e .[dev,novnc]

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  release-checks:
    # Documentation/release consistency: install-command versions, CI matrix
    # vs declared Python support, i18n JSON parity, GPG fingerprint format.
    # Catching these in CI keeps the release checklist honest (see
    # docs/RELEASE_PROCESS.md); the site checkout lives outside this repo and
    # is verified manually with `scripts/check_release.py --site-dir`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run release consistency checks
        run: python3 scripts/check_release.py
