name: Repo packages

# One-shot / re-runnable builder for the packages hosted at repo.mclure.ru
# that are NOT available in the distro archives:
#   python3-pyside6   (deb: bookworm py3.11 / noble py3.12 / trixie py3.13 /
#                      resolute py3.14 — wheel 6.11.2, abi3, cp310+)
#   python3-proxmoxer (rpm: fedora/43 and fedora/44 — one build per Fedora
#                      release so the generated python3.Xdist provides match)
# Built from the official upstream wheels/sdist and uploaded to the repo's
# incoming/ with the restricted deploy key; the server regenerates and signs
# the indexes automatically (systemd path unit + /srv/repo/publish.sh).
# Rebuild these only when a new distro release / python version is adopted.
# (2026-10: fedora/41 is EOL — its catalog stays frozen on the server, no
# new builds target it.)

on:
  workflow_dispatch:
    inputs:
      pyside6_version:
        description: "PySide6 version on PyPI (pinned default)"
        default: "6.8.3"
        required: false
      proxmoxer_version:
        description: "proxmoxer version on PyPI (empty = latest)"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  pyside6-deb:
    name: Build python3-pyside6 (${{ matrix.id }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: bookworm
            image: debian:bookworm
            glib: libglib2.0-0
            alsa: libasound2
          - id: noble
            image: ubuntu:24.04
            glib: libglib2.0-0t64
            # noble keeps the time_t-transition suffix for libasound2
            alsa: libasound2t64
          - id: trixie
            image: debian:trixie
            glib: libglib2.0-0t64
            alsa: libasound2
          # Python 3.14: PySide6 6.8.3 has no cp314 wheel — resolute pins the
          # abi3 (cp310+) 6.11.2 line, which supports 3.14 officially.
          # (6.12.x is known-buggy, do not pick it up.)
          - id: resolute
            image: ubuntu:26.04
            glib: libglib2.0-0t64
            alsa: libasound2
            pyside: "6.11.2"
    env:
      PYSIDE: ${{ matrix.pyside || inputs.pyside6_version }}
      GLIB: ${{ matrix.glib }}
      ALSA: ${{ matrix.alsa }}
    steps:
      - name: Stage PySide6 wheel tree into a deb
        run: |
          set -e
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip
          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          PYNEXT=$(python3 -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]+1}")')
          ABLABEL="py$(printf '%s' "$PYVER" | tr -d .)"
          SITE=/tmp/stage/usr/lib/python3/dist-packages
          mkdir -p /tmp/stage/DEBIAN $SITE
          pip3 install --no-compile --break-system-packages --target $SITE "PySide6==${PYSIDE}"
          SIZE=$(du -sk /tmp/stage | cut -f1)
          # the wheel is self-contained and ships the same files the distro's
          # split pyside6 packages do (Ubuntu 26.04 pulls libpyside6-py3-6.10
          # in via Recommends of python3-pyqtgraph) — co-installation is
          # impossible, so replace it gracefully instead of a dpkg error
          # Depends is the full DT_NEEDED closure of the shipped Qt libraries
          # (readelf over libQt6WebEngineCore and friends): ALSA, the X
          # extension libs, gbm/drm/atomic — none of them exist in a minimal
          # apt environment, and the v3.0.4 release smoke failed exactly there
          # (libasound.so.2). ALSA is libasound2t64 on noble (time_t suffix).
          cat > /tmp/stage/DEBIAN/control <<EOF
          Package: python3-pyside6
          Version: ${PYSIDE}-4+${ABLABEL}
          Section: python
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE}
          Depends: python3 (>= ${PYVER}), python3 (<< ${PYNEXT}), libgl1, libegl1, libxkbcommon0, libxkbfile1, libdbus-1-3, libx11-6, libxcb1, libx11-xcb1, libxext6, libxfixes3, libxcomposite1, libxdamage1, libxi6, libxrandr2, libxrender1, libxtst6, libxshmfence1, libdrm2, libgbm1, libatomic1, libfontconfig1, ${GLIB}, ${ALSA}, libnss3
          Provides: libpyside6-py3 (= ${PYSIDE}), libshiboken6-py3 (= ${PYSIDE})
          Conflicts: libpyside6-py3, libpyside6-py3-6.10, libshiboken6-py3, libshiboken6-py3-6.10, python3-pyside6uic, python3-pyside6utils
          Replaces: libpyside6-py3, libpyside6-py3-6.10, libshiboken6-py3, libshiboken6-py3-6.10, python3-pyside6uic, python3-pyside6utils
          Maintainer: Taurus McLure <taurus@mclure.ru>
          Description: Qt 6 bindings for Python 3 (PySide6, from the official wheel)
           Full PySide6 (Essentials + Addons incl. WebEngine), converted from the
           official manylinux wheel for python${PYVER}. Hosted at repo.mclure.ru
           because PySide6 is not packaged in the Debian/Ubuntu archives.
          EOF
          dpkg-deb --build --root-owner-group /tmp/stage \
            "/tmp/python3-pyside6_${PYSIDE}-4+${ABLABEL}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: pyside6-deb-${{ matrix.id }}
          path: /tmp/python3-pyside6_*.deb

  proxmoxer-rpm:
    name: Build python3-proxmoxer (fedora/${{ matrix.fc }})
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fc: 43
          - fc: 44
    env:
      PROXMOXER: ${{ inputs.proxmoxer_version }}
    steps:
      - name: Build rpm from the PyPI sdist
        run: |
          set -e
          dnf install -y -q python3-pip python3-devel python3-setuptools rpm-build
          if [ -z "${PROXMOXER}" ]; then
            PROXMOXER=$(curl -fsSL https://pypi.org/pypi/proxmoxer/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          fi
          echo "proxmoxer version: ${PROXMOXER}"
          mkdir -p /tmp/rpmbuild/BUILD /tmp/rpmbuild/RPMS /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS
          curl -fsSL -o /tmp/rpmbuild/SOURCES/proxmoxer-${PROXMOXER}.tar.gz \
            "https://files.pythonhosted.org/packages/source/p/proxmoxer/proxmoxer-${PROXMOXER}.tar.gz"
          cat > /tmp/rpmbuild/SPECS/python3-proxmoxer.spec <<EOF
          Name:           python3-proxmoxer
          Version:        ${PROXMOXER}
          Release:        1%{?dist}
          Summary:        Python wrapper for the Proxmox 2.x API (HTTP and SSH)
          License:        MIT
          URL:            https://github.com/proxmoxer/proxmoxer
          Source0:        proxmoxer-%{version}.tar.gz
          BuildArch:      noarch
          BuildRequires:  python3-devel
          BuildRequires:  python3-setuptools
          %description
          Proxmoxer is a wrapper around the Proxmox REST API. Hosted at
          repo.mclure.ru because it is not packaged in the Fedora repositories.
          The rpm is built on the same Fedora release the virtdeck rpm targets,
          so the generated python3.Xdist(proxmoxer) provides match exactly.
          %prep
          %autosetup -n proxmoxer-%{version}
          %build
          %py3_build
          %install
          %py3_install
          %files
          %{python3_sitelib}/proxmoxer/
          %{python3_sitelib}/proxmoxer-*/
          EOF
          rpmbuild -bb --define "_topdir /tmp/rpmbuild" \
            /tmp/rpmbuild/SPECS/python3-proxmoxer.spec
          mkdir -p /tmp/relout
          cp /tmp/rpmbuild/RPMS/noarch/*.rpm /tmp/relout/
      - uses: actions/upload-artifact@v4
        with:
          name: proxmoxer-rpm-fc${{ matrix.fc }}
          path: /tmp/relout/*.rpm

  publish:
    name: Publish to repo.mclure.ru
    needs: [pyside6-deb, proxmoxer-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyside6-deb-bookworm
          path: upload/apt/bookworm/
      - uses: actions/download-artifact@v4
        with:
          name: pyside6-deb-noble
          path: upload/apt/noble/
      - uses: actions/download-artifact@v4
        with:
          name: pyside6-deb-trixie
          path: upload/apt/trixie/
      - uses: actions/download-artifact@v4
        with:
          name: pyside6-deb-resolute
          path: upload/apt/resolute/
      - uses: actions/download-artifact@v4
        with:
          name: proxmoxer-rpm-fc43
          path: upload/rpm/fedora/43/
      - uses: actions/download-artifact@v4
        with:
          name: proxmoxer-rpm-fc44
          path: upload/rpm/fedora/44/
      - name: rsync into repo incoming/
        env:
          KEY: ${{ secrets.REPO_DEPLOY_KEY }}
        run: |
          set -e
          # lift nested artifact contents into their canonical place (artifact
          # nesting has bitten us before): deb -> upload/apt/<suite>/,
          # rpm -> upload/rpm/fedora/<rel>/ routed by the %{dist} tag
          find upload/apt -mindepth 3 -type f -name '*.deb' | while IFS= read -r f; do
            suite=$(echo "$f" | cut -d/ -f3)
            mv -f "$f" "upload/apt/$suite/"
          done
          find upload/rpm -type f -name '*.rpm' | while IFS= read -r f; do
            case "$(basename "$f")" in
              *fc43*) d=upload/rpm/fedora/43 ;;
              *fc44*) d=upload/rpm/fedora/44 ;;
              *) echo "unknown rpm dist tag: $f"; exit 1 ;;
            esac
            mkdir -p "$d"
            if [ "$(dirname "$f")" != "$d" ]; then mv -f "$f" "$d/"; fi
          done
          find upload -mindepth 2 -type d -empty -delete 2>/dev/null || true
          ls -R upload | head -30
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          RSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          rsync -rv -e "$RSH" upload/apt/ repo-upload@repo.mclure.ru:apt/
          rsync -rv -e "$RSH" upload/rpm/ repo-upload@repo.mclure.ru:rpm/
          echo "the server regenerates and signs the indexes automatically"
