[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtdeck"
version = "3.0.1"
description = "Desktop client for Proxmox VE clusters"
readme = "README.md"
authors = [{ name = "Taurus McLure", email = "taurus@mclure.ru" }]
license = { text = "GPL-3.0-only" }
keywords = ["proxmox", "pve", "pyside6", "virtualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "proxmoxer>=2.0",
    "requests>=2.32.0",
    "urllib3>=1.26",
    "pyqtgraph>=0.12",
    "cryptography>=38.0",
    "keyring>=24.0",
    # On Windows the app ships with bundled deps (PyInstaller build), so the
    # noVNC console bridge must always be there; on Linux it is optional
    # (system python) — see the "novnc" extra below.
    # websockets >=14 required: WsBridge uses `additional_headers` from the
    # asyncio implementation (in 12–13 top-level connect is legacy with
    # `extra_headers` and the bridge would fail on every connection).
    "websockets>=14.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Built-in noVNC console (WS bridge). Without it the app runs fine,
# the console shows a clear "module not installed" hint.
novnc = ["websockets>=14.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.urls]
"Homepage" = "https://github.com/mcluremail/virtdeck"
"Bug Tracker" = "https://github.com/mcluremail/virtdeck/issues"

[project.scripts]
virtdeck = "virtdeck.main:main"

[tool.setuptools.packages.find]
include = ["virtdeck*"]

[tool.setuptools.package-data]
"virtdeck.ui.i18n" = ["*.json"]
"virtdeck.ui.console" = ["novnc/**/*.js", "novnc/LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
